<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>A.R.E.S</title>
<style>
body { display:flex; font-family:sans-serif; }
#left { width:70%; }
#right { width:30%; height:95vh; overflow:auto; }
canvas { border:1px solid black; }
.unitBox { border:1px solid #aaa; margin:5px; padding:5px; }
</style>
</head>
<body>

<div id="left">
<h2>A.R.E.S</h2>
<button onclick="start()">スタート</button>
<button onclick="pause()">一時停止</button>
<button onclick="skip()">スキップ</button>
<div id="winner"></div>
<canvas id="canvas" width="700" height="400"></canvas>
</div>

<div id="right">
<button onclick="saveStatus()">ステータス保存</button>
<div id="panel"></div>
</div>

<script>
const ctx = canvas.getContext("2d");

let units=[], bullets=[], popups=[];
let savedData=[];
let running=false, paused=false, fast=false;

const damageTable = {
 "ドカン":{"かるーい":2,"おもーい":1,"まぜまぜ":1,"ふしぎー":0.5,"もちもち":0.5},
 "ズバッ":{"かるーい":0.5,"おもーい":2,"まぜまぜ":1,"ふしぎー":1,"もちもち":1},
 "バラバラ":{"かるーい":0.5,"おもーい":1.5,"まぜまぜ":2,"ふしぎー":1,"もちもち":1},
 "グルル":{"かるーい":1,"おもーい":0.5,"まぜまぜ":0.5,"ふしぎー":2,"もちもち":1},
 "ブルブル":{"かるーい":1,"おもーい":0.5,"まぜまぜ":0.5,"ふしぎー":1.5,"もちもち":2}
};

class Unit{
 constructor(team,x,y,id){
  this.team=team;
  this.id=id;
  this.x=x; this.y=y;

  this.maxHp=30; this.hp=30;
  this.range=400;

  this.attack="ドカン";
  this.defense="かるーい";
  this.weapon="なし";
  this.cover="使わない";

  this.lastAttack=0;
  this.dead=false;
 }
}

function init(){
 units=[]; bullets=[]; popups=[];
 for(let i=0;i<4;i++){
  units.push(new Unit("red",50,80*i+50,i+1));
 }
 for(let i=0;i<4;i++){
  units.push(new Unit("blue",650,80*i+50,i+1));
 }
 document.getElementById("winner").innerText="";
 buildUI();
}

function applySaved(){
 if(savedData.length===0) return;
 units.forEach((u,i)=>{
  Object.assign(u, savedData[i]);
 });
}

function saveStatus(){
 savedData = units.map(u=>({
  range:Number(document.getElementById("range"+u.team+u.id).value),
  hp:Number(document.getElementById("hp"+u.team+u.id).value),
  maxHp:Number(document.getElementById("hp"+u.team+u.id).value),
  attack:document.getElementById("atk"+u.team+u.id).value,
  defense:document.getElementById("def"+u.team+u.id).value,
  weapon:document.getElementById("wp"+u.team+u.id).value,
  cover:document.getElementById("cv"+u.team+u.id).value
 }));
 alert("保存完了");
}

function start(){
 running=true; paused=false; fast=false;
 init();
 applySaved();
 loop();
}

function pause(){paused=!paused;}
function skip(){fast=true;}

function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

function update(){

 for(let u of units){
  if(u.dead) continue;

  let enemies=units.filter(e=>e.team!==u.team && !e.dead);
  if(enemies.length===0){endGame(u.team);return;}

  let inRange=enemies.filter(e=>distance(u,e)<=u.range);

  if(inRange.length>0){
   let t=inRange.sort((a,b)=>distance(u,a)-distance(u,b))[0];

   if(performance.now()-u.lastAttack>600){
    u.lastAttack=performance.now();

    bullets.push({
     x:u.x,y:u.y,
     startX:u.x,startY:u.y,
     target:t,
     owner:u,
     speed:5,
     born:performance.now()
    });
   }

  }else{
   let t=enemies.sort((a,b)=>distance(u,a)-distance(u,b))[0];
   let dx=t.x-u.x, dy=t.y-u.y;
   let len=Math.hypot(dx,dy);
   u.x+=dx/len*2; u.y+=dy/len*2;
  }
 }

 // 弾処理
 for(let b of bullets){

  if(b.target.dead) continue;

  let dx=b.target.x-b.x, dy=b.target.y-b.y;
  let len=Math.hypot(dx,dy);
  b.x+=dx/len*b.speed;
  b.y+=dy/len*b.speed;

  // 命中
  if(len<6){
    if(Math.random()>0.1){
      let mult=damageTable[b.owner.attack][b.target.defense];
      let dmg=2*mult;
      b.target.hp-=dmg;
      popups.push({x:b.target.x,y:b.target.y,text:"-"+dmg,life:50});
      if(b.target.hp<=0) b.target.dead=true;
    }else{
      popups.push({x:b.target.x,y:b.target.y,text:"miss",life:50});
    }
    b.hit=true;
  }

  // 射程+100超え
  let distFromStart=Math.hypot(b.x-b.startX,b.y-b.startY);
  if(distFromStart > b.owner.range + 100){
    b.hit=true;
  }

  // 発射者死亡後1秒
  if(b.owner.dead && performance.now()-b.born > 1000){
    b.hit=true;
  }
 }

 bullets=bullets.filter(b=>!b.hit);
}

function endGame(team){
 running=false;
 bullets=[];
 popups=[];
 setTimeout(()=>{
  document.getElementById("winner").innerText=team+" 勝利";
 },800);
}

function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);

 for(let u of units){
  if(u.dead) continue;

  ctx.beginPath();
  ctx.fillStyle=u.team==="red"?"red":"blue";
  ctx.arc(u.x,u.y,10,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="white";
  ctx.fillText(u.id,u.x-3,u.y+3);

  let r=u.hp/u.maxHp;
  let col="green"; if(r<0.5) col="orange"; if(r<0.2) col="red";

  ctx.fillStyle="#ccc"; ctx.fillRect(u.x-15,u.y-20,30,4);
  ctx.fillStyle=col; ctx.fillRect(u.x-15,u.y-20,30*r,4);

  ctx.fillStyle="black";
  ctx.fillText(Math.ceil(u.hp),u.x-6,u.y-25);
 }

 // 弾
 for(let b of bullets){
  ctx.beginPath();
  ctx.fillStyle="black";
  ctx.arc(b.x,b.y,3,0,Math.PI*2);
  ctx.fill();
 }

 // ポップアップ
 for(let p of popups){
  ctx.globalAlpha=p.life/50;
  ctx.fillStyle="black";
  ctx.fillText(p.text,p.x,p.y);
  p.y-=0.5; p.life--;
 }
 ctx.globalAlpha=1;
 popups=popups.filter(p=>p.life>0);
}

function loop(){
 if(!running) return;
 if(!paused){
  let step=fast?20:1;
  for(let i=0;i<step;i++) update();
 }
 draw();
 requestAnimationFrame(loop);
}

// UI
function buildUI(){
 let panel=document.getElementById("panel");
 panel.innerHTML="";

 let ordered=[
  ...units.filter(u=>u.team==="red"),
  ...units.filter(u=>u.team==="blue")
 ];

 ordered.forEach(u=>{
  let div=document.createElement("div");
  div.className="unitBox";

  div.innerHTML=`
  <b>${u.team}${u.id}</b><br>
  射程:<input id="range${u.team}${u.id}" value="${u.range}"><br>
  HP:<input id="hp${u.team}${u.id}" value="${u.hp}"><br>
  攻撃:<select id="atk${u.team}${u.id}">
    ${Object.keys(damageTable).map(a=>`<option>${a}</option>`)}
  </select><br>
  防御:<select id="def${u.team}${u.id}">
    ${["かるーい","おもーい","まぜまぜ","ふしぎー","もちもち"].map(d=>`<option>${d}</option>`)}
  </select><br>
  武器:<select id="wp${u.team}${u.id}">
    <option>なし</option>
  </select><br>
  遮蔽:<select id="cv${u.team}${u.id}">
    <option>使う</option>
    <option selected>使わない</option>
  </select>
  `;

  panel.appendChild(div);
 });
}

init();
</script>
</body>
</html>
