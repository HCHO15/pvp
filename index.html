<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>戦術対抗戦 編成アドバイザー</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Helvetica Neue', Arial, 'Hiragino Sans', sans-serif; font-size: 13px; color: #111827; background: #F3F4F6; padding: 16px; }
    .page { max-width: 960px; margin: 0 auto; }
    h1 { font-size: 15px; font-weight: 700; color: #1E40AF; margin-bottom: 12px; }

    .tabs { display: flex; margin-bottom: 16px; border-bottom: 2px solid #E5E7EB; }
    .tab-btn { padding: 7px 20px; font-size: 13px; font-family: inherit; border: none; background: none; cursor: pointer; color: #6B7280; border-bottom: 2px solid transparent; margin-bottom: -2px; white-space: nowrap; }
    .tab-btn.active { color: #1E40AF; font-weight: 600; border-bottom-color: #3B82F6; }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    .chip { display: inline-block; padding: 0 7px; border-radius: 4px; font-size: 11px; font-weight: 600; border: 1px solid; white-space: nowrap; line-height: 19px; }
    .chip-爆発,  .chip-軽装備   { background:#FEE2E2; color:#B91C1C; border-color:#FECACA; }
    .chip-貫通,  .chip-重装甲   { background:#FEF9C3; color:#92400E; border-color:#FDE68A; }
    .chip-分解,  .chip-複合装甲 { background:#DCFCE7; color:#166534; border-color:#BBF7D0; }
    .chip-神秘,  .chip-特殊装甲 { background:#DBEAFE; color:#1E40AF; border-color:#BFDBFE; }
    .chip-振動,  .chip-弾力装甲 { background:#EDE9FE; color:#5B21B6; border-color:#DDD6FE; }
    .chip-range { background:#F0F9FF; color:#0369A1; border-color:#BAE6FD; }

    .toggle-btn { display: inline-flex; align-items: center; gap: 6px; padding: 5px 14px; border-radius: 6px; border: 1px solid #BBF7D0; background: #DCFCE7; color: #166534; font-size: 12px; font-weight: 600; font-family: inherit; cursor: pointer; margin-bottom: 14px; transition: all .15s; }
    .toggle-btn.off { background:#F3F4F6; color:#6B7280; border-color:#D1D5DB; }
    .toggle-dot { width:8px; height:8px; border-radius:50%; background:#166534; flex-shrink:0; }
    .toggle-btn.off .toggle-dot { background:#9CA3AF; }

    /* D入力パネル */
    .d-panel { background:#fff; border:1px solid #E5E7EB; border-radius:10px; margin-bottom:14px; overflow:hidden; }
    .d-panel-header { display:grid; grid-template-columns:repeat(4,1fr); border-bottom:1px solid #E5E7EB; }
    .d-panel-head { font-size:11px; font-weight:700; color:#B91C1C; padding:6px 10px; background:#FEF2F2; text-align:center; border-right:1px solid #E5E7EB; }
    .d-panel-head:last-child { border-right:none; }
    .d-panel-body { display:grid; grid-template-columns:repeat(4,1fr); }
    .d-slot-col { padding:10px; border-right:1px solid #E5E7EB; }
    .d-slot-col:last-child { border-right:none; }
    .field-row { display:flex; align-items:center; gap:5px; margin-bottom:6px; }
    .field-row:last-child { margin-bottom:0; }
    .field-lbl { font-size:10px; color:#4B5563; width:24px; flex-shrink:0; font-weight:500; }
    .field-row select { flex:1; font-size:12px; padding:3px 5px; border:1px solid #E5E7EB; border-radius:5px; background:#F9FAFB; color:#111827; font-family:inherit; cursor:pointer; }
    .chip-preview { margin-top:5px; min-height:20px; display:flex; flex-wrap:wrap; gap:3px; }

    /* 属性推奨パネル */
    .result-section-label { font-size:11px; font-weight:700; color:#374151; letter-spacing:.06em; text-transform:uppercase; margin-bottom:8px; }
    .attr-panel { background:#fff; border:1px solid #E5E7EB; border-radius:10px; margin-bottom:10px; overflow:hidden; }
    .attr-panel-header { display:grid; grid-template-columns:repeat(4,1fr); border-bottom:1px solid #E5E7EB; background:#EFF6FF; }
    .attr-panel-head { font-size:11px; font-weight:700; color:#1E40AF; padding:6px 10px; text-align:center; border-right:1px solid #E5E7EB; }
    .attr-panel-head:last-child { border-right:none; }
    .attr-panel-body { display:grid; grid-template-columns:repeat(4,1fr); }
    .attr-slot-col { padding:8px 10px; border-right:1px solid #E5E7EB; min-height:40px; }
    .attr-slot-col:last-child { border-right:none; }

    .combo-inline-list { display:flex; flex-direction:column; gap:3px; }
    .combo-inline { display:flex; align-items:center; gap:5px; padding:3px 6px; border-radius:5px; border:1px solid #E5E7EB; background:#FAFAFA; }
    .combo-inline.rank-1 { background:#F0FFF8; border-color:#6EE7B7; }
    .rank-badge { width:16px; height:16px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; border:1px solid; }
    .rb-1 { background:#FEF3C7; color:#92400E; border-color:#FDE68A; }
    .rb-2 { background:#F1F5F9; color:#475569; border-color:#CBD5E1; }
    .combo-names { display:flex; align-items:center; gap:3px; flex:1; flex-wrap:wrap; }
    .combo-x { font-size:10px; color:#D1D5DB; }
    .combo-scores { display:flex; gap:4px; }
    .sc { font-size:10px; color:#9CA3AF; display:flex; align-items:center; gap:2px; }
    .mt { font-size:10px; padding:0 4px; border-radius:3px; font-weight:600; line-height:16px; display:inline-block; }
    .atk-2{background:#DCFCE7;color:#166534;} .atk-15{background:#D1FAE5;color:#065F46;}
    .atk-1{background:#F3F4F6;color:#6B7280;} .atk-05{background:#FEE2E2;color:#B91C1C;}
    .def-05{background:#DCFCE7;color:#166534;} .def-1{background:#F3F4F6;color:#6B7280;} .def-hi{background:#FEE2E2;color:#B91C1C;}
    .empty-msg { font-size:11px; color:#6B7280; }

    /* 射程ルール照合 */
    .range-section { margin-top:14px; }
    .range-section-label { font-size:11px; font-weight:700; color:#374151; letter-spacing:.06em; text-transform:uppercase; margin-bottom:8px; }
    .range-no-match { font-size:12px; color:#6B7280; padding:6px 0; }
    .rule-set { background:#fff; border:1px solid #BAE6FD; border-radius:10px; margin-bottom:8px; overflow:hidden; }
    .rule-set-header { background:#F0F9FF; padding:6px 12px; font-size:11px; font-weight:600; color:#0369A1; border-bottom:1px solid #BAE6FD; }
    .rule-set-body { display:grid; grid-template-columns:repeat(4,1fr); }
    .rule-set-col { padding:8px 10px; border-right:1px solid #E5E7EB; min-height:36px; }
    .rule-set-col:last-child { border-right:none; }
    .rule-set-col-head { font-size:10px; font-weight:700; color:#0369A1; margin-bottom:4px; }
    .rule-range-chips { display:flex; flex-wrap:wrap; gap:3px; margin-bottom:5px; }
    .rule-attr-divider { border-top:1px dashed #E5E7EB; margin:5px 0; }
    .rule-attr-label { font-size:10px; color:#4B5563; font-weight:600; margin-bottom:3px; }

    /* 相性表 */
    .matrix-wrap { overflow-x:auto; }
    .mtx { border-collapse:collapse; font-size:12px; background:#fff; border-radius:8px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.06); }
    .mtx th,.mtx td { padding:8px 12px; border:1px solid #E5E7EB; text-align:center; }
    .mtx thead th,.mtx tbody th { background:#F9FAFB; }
    .mtx tbody th { text-align:left; }
    .cx2{background:#DCFCE7;color:#166534;font-weight:700;} .cx15{background:#D1FAE5;color:#065F46;font-weight:600;}
    .cx1{color:#9CA3AF;} .cx05{background:#FEE2E2;color:#B91C1C;}

    /* 射程ルールメモ */
    .rule-form { background:#fff; border:1px solid #E5E7EB; border-radius:10px; padding:16px; margin-bottom:16px; }
    .rule-form-title { font-size:12px; font-weight:700; color:#374151; margin-bottom:12px; }
    .rule-name-row { display:flex; gap:8px; align-items:center; margin-bottom:14px; }
    .rule-name-input { flex:1; font-size:13px; padding:6px 10px; border:1px solid #E5E7EB; border-radius:6px; font-family:inherit; color:#111827; }
    .btn-primary { padding:7px 16px; border-radius:6px; border:none; cursor:pointer; font-size:12px; font-family:inherit; font-weight:600; background:#2563EB; color:#fff; white-space:nowrap; }
    .btn-primary:hover { background:#1D4ED8; }
    .rule-slots-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .rule-col-title { font-size:11px; font-weight:700; margin-bottom:8px; }
    .rule-col-title.a { color:#1E40AF; }
    .rule-col-title.d { color:#B91C1C; }
    .rule-slot-row { display:flex; gap:6px; align-items:flex-start; margin-bottom:10px; }
    .rule-slot-num { font-size:11px; color:#9CA3AF; width:22px; padding-top:3px; flex-shrink:0; font-weight:600; }
    .rule-slot-inputs { display:flex; flex-direction:column; gap:5px; flex:1; }
    .cb-group { display:flex; flex-wrap:wrap; gap:4px; }
    .cb-item { display:none; }
    .cb-label { display:inline-flex; align-items:center; padding:2px 8px; border-radius:4px; border:1px solid #E5E7EB; font-size:11px; cursor:pointer; background:#F9FAFB; color:#374151; transition:all .1s; user-select:none; }
    .cb-item:checked + .cb-label { background:#0369A1; color:#fff; border-color:#0369A1; }
    .target-row { display:flex; align-items:center; gap:5px; }
    .target-lbl { font-size:10px; color:#9CA3AF; white-space:nowrap; }
    .target-select { font-size:11px; padding:2px 4px; border:1px solid #E5E7EB; border-radius:4px; background:#F9FAFB; color:#111827; font-family:inherit; cursor:pointer; }
    .save-msg { font-size:11px; color:#059669; margin-left:4px; }
    .save-err { font-size:11px; color:#B91C1C; margin-left:4px; }
    .section-label { font-size:11px; font-weight:600; color:#9CA3AF; letter-spacing:.06em; text-transform:uppercase; margin-bottom:10px; }
    .saved-rules-wrap { max-height:500px; overflow-y:auto; }
    .rule-card { background:#fff; border:1px solid #E5E7EB; border-radius:8px; margin-bottom:6px; overflow:hidden; }
    .rule-card-header { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; cursor:pointer; user-select:none; }
    .rule-card-header:hover { background:#F9FAFB; }
    .rule-card-name { font-size:13px; font-weight:600; color:#111827; }
    .rule-card-right { display:flex; align-items:center; gap:8px; }
    .rule-expand-btn { font-size:12px; color:#9CA3AF; transition:transform .2s; }
    .rule-expand-btn.open { transform:rotate(180deg); }
    .btn-danger { padding:4px 10px; border-radius:5px; border:1px solid #FECACA; cursor:pointer; font-size:11px; font-family:inherit; background:#FEF2F2; color:#B91C1C; }
    .btn-danger:hover { background:#FEE2E2; }
    .btn-copy { padding:4px 10px; border-radius:5px; border:1px solid #BBF7D0; cursor:pointer; font-size:11px; font-family:inherit; background:#F0FDF4; color:#166534; }
    .btn-copy:hover { background:#DCFCE7; }
    .btn-edit { padding:4px 10px; border-radius:5px; border:1px solid #BFDBFE; cursor:pointer; font-size:11px; font-family:inherit; background:#EFF6FF; color:#1E40AF; }
    .btn-edit:hover { background:#DBEAFE; }
    .edit-form { background:#F0F9FF; border:1px solid #BAE6FD; border-radius:8px; padding:12px; margin-top:8px; }
    .edit-form-title { font-size:11px; font-weight:700; color:#0369A1; margin-bottom:10px; }
    .edit-name-row { display:flex; gap:6px; margin-bottom:10px; }
    .edit-name-input { flex:1; font-size:12px; padding:5px 8px; border:1px solid #BAE6FD; border-radius:5px; font-family:inherit; }
    .btn-edit-save { padding:5px 12px; border-radius:5px; border:none; cursor:pointer; font-size:11px; font-family:inherit; font-weight:600; background:#0369A1; color:#fff; }
    .btn-edit-cancel { padding:5px 10px; border-radius:5px; border:1px solid #E5E7EB; cursor:pointer; font-size:11px; font-family:inherit; background:#fff; color:#6B7280; }
    .rule-card-body { display:none; padding:10px 14px 12px; border-top:1px solid #F3F4F6; }
    .rule-card-body.open { display:block; }
    .rule-body-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .rule-body-col-title { font-size:10px; font-weight:700; color:#9CA3AF; margin-bottom:6px; text-transform:uppercase; }
    .rule-slot-chips { display:flex; align-items:center; gap:4px; flex-wrap:wrap; margin-bottom:4px; }
    .rule-slot-lbl { font-size:10px; color:#9CA3AF; font-weight:600; }
    .empty-rules { font-size:13px; color:#D1D5DB; text-align:center; padding:28px 0; }
    .note { font-size:11px; color:#B0B5BE; margin-top:10px; }

    /* おすすめ生徒ポップアップ */
    .student-btn-wrap { display: inline-block; margin-top: 6px; }
    .student-btn {
      padding: 3px 10px; border-radius: 5px; border: 1px solid #DDD6FE;
      background: #EDE9FE; color: #5B21B6; font-size: 11px; font-weight: 600;
      font-family: inherit; cursor: pointer; white-space: nowrap;
    }
    .student-btn:hover { background: #DDD6FE; }
    .student-popup {
      display: none; position: fixed;
      background: #fff; border: 1px solid #E5E7EB; border-radius: 10px;
      padding: 10px; box-shadow: 0 8px 32px rgba(0,0,0,.18);
      z-index: 9999; min-width: 200px; max-width: 340px;
    }
    .student-popup.open { display: block; }
    .student-popup-title { font-size: 10px; font-weight: 700; color: #6B7280; margin-bottom: 7px; }
    .student-faces { display: flex; flex-wrap: wrap; gap: 6px; }
    .student-face { display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: default; }
    .student-face img { width: 44px; height: 44px; border-radius: 8px; border: 1px solid #E5E7EB; object-fit: cover; background: #F3F4F6; }
    .student-face img.img-err { background: #F3F4F6; border: 1px dashed #D1D5DB; }
    .student-face-name { font-size: 9px; color: #6B7280; text-align: center; max-width: 48px; line-height: 1.2; word-break: break-all; }
    .student-score-bar { display: flex; gap: 2px; }
    .score-dot { width: 5px; height: 5px; border-radius: 50%; }
    .score-dot.on  { background: #7C3AED; }
    .score-dot.off { background: #E5E7EB; }
    .no-student { font-size: 11px; color: #9CA3AF; }

    /* スライダー（カスタム） */
    .env-slider-wrap { flex: 1; position: relative; height: 20px; display: flex; align-items: center; cursor: pointer; }
    .env-slider-track { width: 100%; height: 6px; border-radius: 3px; background: #D1D5DB; position: relative; overflow: hidden; }
    .env-slider-fill { height: 100%; background: #2563EB; border-radius: 3px; }
    .env-slider-thumb {
      position: absolute; top: 50%; width: 20px; height: 20px; border-radius: 50%;
      background: #2563EB; border: 2px solid #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,.25);
      transform: translate(-50%, -50%);
      cursor: grab; touch-action: none;
      transition: box-shadow 0.1s;
    }
    .env-slider-thumb:active, .env-slider-thumb.dragging { cursor: grabbing; box-shadow: 0 2px 8px rgba(37,99,235,.4); }

    /* 生徒アイコンフレーム */
    .student-face { position: relative; }
    .student-face img {
      width: 44px; height: 44px; border-radius: 8px;
      object-fit: cover; background: #F3F4F6; display: block;
      border: none; /* フレームはcanvasで描画 */
      outline: none;
    }
    .student-frame {
      position: absolute; inset: 0;
      border-radius: 8px;
      pointer-events: none;
    }

    /* 生徒名オートコンプリート */
    .student-input-wrap { position: relative; margin-bottom: 6px; }
    .student-input {
      width: 100%; font-size: 12px; padding: 4px 6px;
      border: 1px solid #E5E7EB; border-radius: 5px;
      background: #F9FAFB; font-family: inherit; color: #111827;
      box-sizing: border-box;
    }
    .student-input:focus { outline: none; border-color: #BAE6FD; background: #fff; }
    .student-suggest {
      position: absolute; top: 100%; left: 0; right: 0; z-index: 200;
      background: #fff; border: 1px solid #E5E7EB; border-radius: 6px;
      box-shadow: 0 4px 12px rgba(0,0,0,.1); max-height: 160px; overflow-y: auto;
      display: none;
    }
    .student-suggest.open { display: block; }
    .student-suggest-item {
      padding: 5px 8px; font-size: 12px; cursor: pointer; color: #374151;
      display: flex; align-items: center; gap: 6px;
    }
    .student-suggest-item:hover { background: #EFF6FF; }
    .student-suggest-item img { width: 24px; height: 24px; border-radius: 4px; object-fit: cover; background: #F3F4F6; }

    /* 手持ち・育成状況 */
    .roster-grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .roster-icon {
      position: relative; width: 44px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .roster-icon img {
      width: 44px; height: 44px; border-radius: 8px; object-fit: cover;
      background: #F3F4F6; border: 1px solid #E5E7EB;
      transition: filter 0.15s;
    }
    .roster-icon.unowned img { filter: grayscale(100%) brightness(0.7); }
    .roster-icon-name { font-size: 8px; color: #6B7280; text-align: center; max-width: 44px; line-height: 1.2; }
    /* おすすめ生徒ポップアップ: モノクロ表示用 */
    .student-face.greyed img { filter: grayscale(100%) brightness(0.7); }

    .sheet-load-area { background:#fff; border:1px solid #E5E7EB; border-radius:10px; padding:16px; margin-bottom:14px; }
    .sheet-url-row { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
    .sheet-url-input { flex:1; font-size:12px; padding:6px 10px; border:1px solid #E5E7EB; border-radius:6px; font-family:inherit; color:#111827; }
    .btn-sheet { padding:6px 14px; border-radius:6px; border:none; cursor:pointer; font-size:12px; font-family:inherit; font-weight:600; background:#059669; color:#fff; white-space:nowrap; }
    .btn-sheet:hover { background:#047857; }
    .btn-sheet:disabled { background:#9CA3AF; cursor:not-allowed; }
    .sheet-status { font-size:11px; margin-top:6px; min-height:16px; }
    .sheet-status.ok  { color:#059669; }
    .sheet-status.err { color:#B91C1C; }
    .sheet-status.loading { color:#2563EB; }
    .sheet-chip { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:4px; background:#EFF6FF; border:1px solid #BFDBFE; color:#1E40AF; font-size:11px; margin:2px; }

    .hide-sm { display: inline; }
    .show-sm { display: none; }
    /* ===== レスポンシブ対応 ===== */
    @media (max-width: 480px) {
      .hide-sm { display: none; }
      .show-sm { display: inline; }
    }
    @media (max-width: 720px) {
      .page { padding: 10px; }
      .d-panel-body,
      .d-panel-header { grid-template-columns: repeat(2, 1fr); }
      .attr-panel-body,
      .attr-panel-header { grid-template-columns: repeat(2, 1fr); }
      .rule-set-body { grid-template-columns: repeat(2, 1fr); }
      .rule-slots-grid { grid-template-columns: 1fr; }
      .rule-body-grid { grid-template-columns: 1fr; }
      .rule-grid { grid-template-columns: 1fr; }
      .env-slider-wrap { min-width: 100px; }
      .student-popup {
        min-width: 160px;
        max-width: min(320px, 90vw);
      }
      .tabs { flex-wrap: wrap; }
      .tab-btn { padding: 5px 10px; font-size: 11px; }
    }

    @media (max-width: 480px) {
      .d-panel-body,
      .d-panel-header { grid-template-columns: repeat(2, 1fr); }
      .d-panel-head { font-size: 10px; padding: 4px 6px; }
      .d-slot-col { padding: 8px 6px; }
      .field-lbl { width: 20px; font-size: 9px; }
      .field-row select { font-size: 11px; padding: 2px 3px; }
      .attr-panel-body,
      .attr-panel-header { grid-template-columns: repeat(2, 1fr); }
      .attr-slot-col { padding: 6px 8px; }
      .rule-set-body { grid-template-columns: repeat(2, 1fr); }
      .rule-set-col { padding: 6px 8px; }
      .combo-inline-list { gap: 2px; }
      .combo-inline { padding: 3px 4px; gap: 3px; }
      .chip { font-size: 10px; padding: 0 5px; }
      .roster-grid { gap: 4px; }
      .roster-icon { width: 38px; }
      .roster-icon img { width: 38px; height: 38px; }
      .student-face img { width: 38px; height: 38px; }
      .student-frame { border-radius: 7px; }
      h1 { font-size: 13px; }
    }

    @media (max-width: 380px) {
      .d-panel-body,
      .d-panel-header { grid-template-columns: 1fr 1fr; }
      .attr-panel-body,
      .attr-panel-header { grid-template-columns: 1fr 1fr; }
    }

    .rule-student-wrap { position:relative; margin-bottom:5px; }
    .rule-student-input { width:100%; font-size:11px; padding:3px 6px; border:1px solid #E5E7EB; border-radius:5px; background:#F9FAFB; font-family:inherit; color:#111827; box-sizing:border-box; }
    .rule-student-input:focus { outline:none; border-color:#BAE6FD; background:#fff; }
    .rule-student-suggest { position:absolute; top:100%; left:0; right:0; z-index:300; background:#fff; border:1px solid #E5E7EB; border-radius:6px; box-shadow:0 4px 12px rgba(0,0,0,.1); max-height:140px; overflow-y:auto; display:none; }

let STUDENTS = []; // students.csv から読み込み（失敗時は埋め込みを使用）

function parseStudentsCSV(text) {
  var lines = text.trim().split('\n');
  var result = [];
  for (var i = 1; i < lines.length; i++) { // ヘッダー行スキップ
    var cols = lines[i].split(',');
    if (cols.length < 5) continue;
    result.push({
      name:  cols[0].trim(),
      yomi:  cols[1].trim(),
      range: cols[2].trim(),
      atk:   cols[3].trim(),
      def:   cols[4].trim()
    });
  }
  return result;
}

async function loadStudentsCSV() {
  try {
    var res = await fetch('students.csv');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var text = await res.text();
    STUDENTS = parseStudentsCSV(text);
    rebuildStudentMaps();
  } catch(e) {
    // fetchが失敗した場合（file://環境など）は埋め込みCSVを使用
    console.warn('students.csv fetch失敗、埋め込みデータを使用:', e.message);
    STUDENTS = parseStudentsCSV(STUDENTS_CSV_FALLBACK);
    rebuildStudentMaps();
  }
}

function rebuildStudentMaps() {
  // STUDENT_MAP と STUDENT_NAMES を再構築
  STUDENT_MAP = Object.fromEntries(STUDENTS.map(function(s){ return [s.name, s]; }));
  STUDENT_NAMES = STUDENTS.map(function(s){ return s.name; });
}

// ---- 射程 → 数値変換 ----
const RANGE_NUM = {
  '350':1, '350🛡':1, '450':2, '450🛡':2, '550':3, '550🛡':3,
  '650':4, '650🛡':4, '750':5, '750🛡':5, '850':6, '850🛡':6,
  'ツルギ':0, 'アカネ':0, 'シュン属':0, 'ドヒナ属':0
};
// 射程数値 → W（攻撃重み）: 350→0.2, 850→0.8
function rangeToW(rangeStr) {
  const n = RANGE_NUM[rangeStr] ?? 3;
  if (n === 0) return 0.5; // 特殊射程は中立
  // n: 1(350)〜6(850) → 0.2〜0.8 線形補間
  return 0.2 + (n - 1) / 5 * 0.6;
}

// ---- 遮蔽設定（スロットごとに射程グループ別でON/OFF） ----
// shieldCfg[slotN][rangeGroup] = true(遮蔽必須) / false(遮蔽不問)
// rangeGroup: '350','450','550','650','750','850','特殊'
let shieldCfg = {};
try { shieldCfg = JSON.parse(localStorage.getItem('pvp_shield')||'{}'); } catch(e){}
function getShieldRequired(slotN, rangeBase) {
  return !!(shieldCfg[slotN] && shieldCfg[slotN][rangeBase]);
}
function setShieldRequired(slotN, rangeBase, val) {
  if (!shieldCfg[slotN]) shieldCfg[slotN] = {};
  shieldCfg[slotN][rangeBase] = val;
  try { localStorage.setItem('pvp_shield', JSON.stringify(shieldCfg)); } catch(e){}
}

// ---- 重み付き幾何平均スコア計算 ----
// dAtk: 対面Dの攻撃属性, dDef: 対面Dの防御属性
// isTarget: このAスロットが直接攻撃対象として指定されているか
function calcStudentScore(student, dAtk, dDef, isTarget) {
  const W = isTarget ? 0.15 : rangeToW(student.range);
  const atkScore = dDef ? (DMG[student.atk]?.[dDef] ?? 1.0) : 1.0;
  const defRaw   = dAtk ? (DMG[dAtk]?.[student.def] ?? 1.0) : 1.0;
  const defScore = 1 / defRaw;
  return Math.pow(atkScore, W) * Math.pow(defScore, 1 - W);
}

// ---- 射程フィルタ＋一致度判定 ----
// 戻り値: 'full'（完全一致）| 'partial'（数値一致・🛡違い・OFF時のみ）| false（除外）
// 遮蔽重要ON : 🛡不一致 → false（除外）
// 遮蔽重要OFF: 🛡不一致 → 'partial'（ペナルティ付きで残す）
// 特殊射程（ツルギ等）: 完全一致のみ
function rangeMatchResult(student, rangeList, slotN) {
  if (!rangeList || rangeList.length === 0) return false;
  const sRange     = student.range;
  const sBase      = sRange.replace('🛡','');
  const sHasShield = sRange.includes('🛡');

  // 特殊射程は完全一致のみ
  if (['ツルギ','アカネ','シュン属','ドヒナ属'].includes(sRange))
    return rangeList.includes(sRange) ? 'full' : false;

  let bestMatch = false;
  for (const rec of rangeList) {
    const rBase = rec.replace('🛡','');
    if (rBase !== sBase) continue;

    if (sHasShield === rec.includes('🛡')) {
      bestMatch = 'full';
      break; // 完全一致が見つかればそれ以上探さない
    } else {
      // 🛡不一致
      const shieldImportant = getShieldRequired(slotN, rBase);
      if (shieldImportant) return false; // ON → 除外
      bestMatch = 'partial';             // OFF → ペナルティ付き
    }
  }
  return bestMatch;
}

// ---- 推奨生徒取得 ----
// rule: 照合中のルールオブジェクト, sn: Aスロット番号
function getRecommendedStudents(rangeList, rule, sn) {
  const allMatched = [];
  for (const s of STUDENTS) {
    const match = rangeMatchResult(s, rangeList, sn);
    if (!match) continue;
    let score = calcStudentScore(s, rule, sn);
    const shieldPartial = (match === 'partial');
    if (shieldPartial) score *= envCfg.shield_penalty;
    allMatched.push({ ...s, score, shieldPartial, owned: isOwned(s.name) });
  }
  allMatched.sort((a, b) => b.score - a.score);

  const owned   = allMatched.filter(s => s.owned);
  const unowned = allMatched.filter(s => !s.owned);

  if (owned.length > 0) {
    // 育成済み生徒を表示（最大10件）
    return owned.slice(0, 10).map(s => ({ ...s, forceGrey: false }));
  } else if (unowned.length > 0) {
    // 全員未育成: モノクロで表示
    return unowned.slice(0, 10).map(s => ({ ...s, forceGrey: true }));
  }
  return [];
}

/* ===== 属性スコア計算（編成アドバイス・対面ベース） ===== */
function computeCombos(n){
  const dAtk=adv[n].atk, dDef=adv[n].def;
  if(!dAtk&&!dDef) return null;
  const nbDefs=neighbors(n).map(s=>adv[s].def).filter(Boolean);
  const nbAtks=neighbors(n).map(s=>adv[s].atk).filter(Boolean);
  const combos=[];
  for(const aAtk of activeATK()) for(const aDef of activeDEF()){
    const atkScore=dDef?DMG[aAtk][dDef]:null;
    const defRaw  =dAtk?DMG[dAtk][aDef]:null;
    const defScore=defRaw!==null?2-defRaw:null;
    const primary =(atkScore??0)+(defScore??0);
    const nbAt=nbDefs.length?nbDefs.reduce((s,d)=>s+DMG[aAtk][d],0)/nbDefs.length:0;
    const nbDt=nbAtks.length?nbAtks.reduce((s,a)=>s+(2-DMG[a][aDef]),0)/nbAtks.length:0;
    combos.push({aAtk,aDef,atkScore,defRaw,defScore,primary,tie:nbAt+nbDt});
  }
  combos.sort((a,b)=>{
    if(b.primary!==a.primary) return b.primary-a.primary;
    const ad=a.defScore??0,bd=b.defScore??0;
    if(bd!==ad) return bd-ad;
    return b.tie-a.tie;
  });
  return combos.slice(0,2);
}

/* ===== ルール内ターゲットを使った属性推奨 ===== */
// 戻り値: { combos, isFallback } | null
function computeRuleAttrCombos(rule, sn){
  // calcStudentScore と同じ幾何平均方式でソート
  // atkScore = DMG[aAtk][tgtDDef]  (高いほど良い)
  // defScore = 1 / DMG[attackerDAtk][aDef]  (低い被ダメ = 高スコア)
  // primary  = atkScore^W * defScore^(1-W)

  const tgtAKey = rule.targetA && rule.targetA[sn];
  const tgtANum = tgtAKey ? parseInt(tgtAKey[1]) : sn;
  const isTarget = !!tgtAKey;
  const W = isTarget ? envCfg.W_target : 0.68; // スロット射程不明なのでW=0.68で近似

  const tgtDDef = adv[tgtANum]?.def || '';
  if(!tgtDDef && !adv[sn]?.atk && !adv[sn]?.def) return null;

  const attackerDNum = findAttackerD(rule, sn) ?? sn;
  const attackerDAtk = adv[attackerDNum]?.atk || '';

  const isFallback = !tgtAKey;
  const nbDefs = neighbors(sn).map(s=>adv[s].def).filter(Boolean);
  const nbAtks = neighbors(sn).map(s=>adv[s].atk).filter(Boolean);

  const combos=[];
  for(const aAtk of activeATK()) for(const aDef of activeDEF()){
    const atkScore = tgtDDef ? (DMG[aAtk]?.[tgtDDef] ?? 1.0) : 1.0;
    const defRaw   = attackerDAtk ? (DMG[attackerDAtk]?.[aDef] ?? 1.0) : 1.0;
    const defScore = 1 / defRaw;
    const primary  = Math.pow(atkScore, W) * Math.pow(defScore, 1-W);

    // タイブレーク: 隣接スロットの属性で微調整
    const nbAt = nbDefs.length ? nbDefs.reduce((s,d)=>s+Math.pow(DMG[aAtk]?.[d]??1,W),0)/nbDefs.length : 1;
    const nbDt = nbAtks.length ? nbAtks.reduce((s,a)=>s+Math.pow(1/(DMG[a]?.[aDef]??1),1-W),0)/nbAtks.length : 1;
    const tie  = primary * (nbAt * nbDt - 1) * 0.01; // 主スコアの1%以内

    combos.push({aAtk, aDef, atkScore, defRaw, primary, tie});
  }
  combos.sort((a,b) => (b.primary+b.tie) - (a.primary+a.tie));
  return { combos: combos.slice(0,2), isFallback };
}

/* 推奨射程がツルギ・アカネのみかどうか判定 */
function isSpecialOnly(ranges){
  if(!ranges||!ranges.length) return true;
  return ranges.every(r=>SPECIAL_ONLY.has(r));
}

                      const dotCount = calcDotCount(s, rule, sn);
          const scoreDots=Array.from({length:4},(_,i)=>`<span class="score-dot ${i<dotCount?'on':'off'}"></span>`).join('');

            </div>

      }).join('');
    }
    html+=`</div>`;
  }

  area.innerHTML=html;
}

function copyRule(id) {
  var rule = rules.find(function(r){ return r.id === id; });
  if (!rule) return;
  var SLOTS = [1,2,3,4];
  // 行2: ルール名\tA1射程\t...\tD4射程
  var row2 = [rule.name];
  SLOTS.forEach(function(n){ row2.push((rule.a[n]||[]).join(',')); });
  SLOTS.forEach(function(n){ row2.push((rule.d[n]||[]).join(',')); });
  // 行3: 空\tA1tgt\t...\tD4tgt（ターゲットは大文字 D1/A2 形式）
  var row3 = [''];
  SLOTS.forEach(function(n){
    var t = (rule.targetA && rule.targetA[n]) || '';
    row3.push(t ? t.toUpperCase() : '');
  });
  SLOTS.forEach(function(n){
    var t = (rule.targetD && rule.targetD[n]) || '';
    row3.push(t ? t.toUpperCase() : '');
  });

  var tsv = row2.join('\t') + '\n' + row3.join('\t');

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(tsv).then(function(){
      showCopyMsg(id, 'コピーしました');
    }).catch(function(){
      fallbackCopy(tsv, id);
    });
  } else {
    fallbackCopy(tsv, id);
  }
}

function fallbackCopy(text, id) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    showCopyMsg(id, 'コピーしました');
  } catch(e) {
    showCopyMsg(id, 'コピー失敗');
  }
  document.body.removeChild(ta);
}

  W_max:         0.80, // 射程最長(850)のときの攻撃重み

  W_special:     0.50, // 特殊射程(ツルギ等)のときの攻撃重み
  shield_penalty: 0.70, // 遮蔽重要ONかつ🛡不一致時のスコア係数（OFF時も同係数で減点）
};

// rangeToW を envCfg 参照に更新（上書き）
function rangeToW(rangeStr) {
  const n = RANGE_NUM[rangeStr] ?? 3;
  if (n === 0) return envCfg.W_special;
  return envCfg.W_min + (n - 1) / 5 * (envCfg.W_max - envCfg.W_min);
}

// ---- ドット数計算（表示用） ----
// 幾何平均スコア = atkScore^W × defScore^(1-W)
// 閾値: dot4≥1.90 / dot3≥1.20 / dot2≥0.85 / dot1≥0.55 / dot0<0.55
function calcDotCount(student, rule, sn) {
  const tgtAKey = rule.targetA && rule.targetA[sn];
  const tgtANum = tgtAKey ? parseInt(tgtAKey[1]) : sn;
  const isTarget = !!tgtAKey;
  const W = isTarget ? envCfg.W_target : rangeToW(student.range);

  const tgtDDef  = adv[tgtANum]?.def || '';
  const atkScore = tgtDDef ? (DMG[student.atk]?.[tgtDDef] ?? 1.0) : 1.0;

  const attackerDNum = findAttackerD(rule, sn) ?? sn;
  const attackerDAtk = adv[attackerDNum]?.atk || '';
  const defRaw   = attackerDAtk ? (DMG[attackerDAtk]?.[student.def] ?? 1.0) : 1.0;
  const defScore = 1 / defRaw;

  // 幾何平均（スコア範囲 0.5〜2.0）
  const score = Math.pow(atkScore, W) * Math.pow(defScore, 1 - W);

  if      (score >= 1.90) return 4;
  else if (score >= 1.20) return 3;
  else if (score >= 0.85) return 2;
  else if (score >= 0.55) return 1;
  else                    return 0;
}

function makeFrame(atkColor, defColor) {
  // SVGで上辺+左辺=atk色、下辺+右辺=def色の角丸四角形フレームを生成
  const r = 8; // border-radius
  const s = 44; // size
  const t = 2.5; // stroke width
  const h = t / 2;
  // パスを4辺に分けて描画（上辺+左辺, 下辺+右辺）
  // 上辺+左辺: 左上から右上へ、さらに右上から右下へは描かない
  const topLeft = `M ${r+h},${h} L ${s-r-h},${h} Q ${s-h},${h} ${s-h},${r+h} `; // 上辺+右上角
  const rightBottom = `L ${s-h},${s-r-h} Q ${s-h},${s-h} ${s-r-h},${s-h} L ${r+h},${s-h} Q ${h},${s-h} ${h},${s-r-h} `; // 右辺+下辺+左下角
  const leftTop = `L ${h},${r+h} Q ${h},${h} ${r+h},${h}`; // 左辺+左上角（閉じ）

  return `<svg class="student-frame" viewBox="0 0 ${s} ${s}" xmlns="http://www.w3.org/2000/svg">
    <path d="M ${r+h},${h} L ${s-r-h},${h}" stroke="${atkColor}" stroke-width="${t}" fill="none" stroke-linecap="round"/>
    <path d="M ${h},${r+h} L ${h},${s-r-h}" stroke="${atkColor}" stroke-width="${t}" fill="none" stroke-linecap="round"/>
    <path d="M ${r+h},${s-h} L ${s-r-h},${s-h}" stroke="${defColor}" stroke-width="${t}" fill="none" stroke-linecap="round"/>
    <path d="M ${s-h},${r+h} L ${s-h},${s-r-h}" stroke="${defColor}" stroke-width="${t}" fill="none" stroke-linecap="round"/>
    <circle cx="${r+h}" cy="${r+h}" r="${r}" stroke="${atkColor}" stroke-width="${t}" fill="none" clip-path="inset(0 50% 50% 0)"/>
    <circle cx="${s-r-h}" cy="${r+h}" r="${r}" stroke="${atkColor}" stroke-width="${t}" fill="none" clip-path="inset(0 0 50% 50%)"/>
    <circle cx="${r+h}" cy="${s-r-h}" r="${r}" stroke="${defColor}" stroke-width="${t}" fill="none" clip-path="inset(50% 50% 0 0)"/>
    <circle cx="${s-r-h}" cy="${s-r-h}" r="${r}" stroke="${defColor}" stroke-width="${t}" fill="none" clip-path="inset(50% 0 0 50%)"/>
  </svg>`;
}
// ---- ターゲット逆引き：A${sn}を攻撃対象にしているDスロットを探す ----
function findAttackerD(rule, aSlotN) {
  for (const dn of SLOTS) {
    const tgt = rule.targetD && rule.targetD[dn];
    if (tgt && tgt === `a${aSlotN}`) return dn;
  }
  return null; // 誰も指定していない
}

// calcStudentScore: ルールのターゲット情報を使って計算
// rule: 照合中のルールオブジェクト, sn: Aスロット番号
function calcStudentScore(student, rule, sn) {
  // --- atkScore: このAが攻撃するターゲットDの防御属性 ---
  const tgtAKey = rule.targetA && rule.targetA[sn]; // 例 "d2"
  const tgtANum = tgtAKey ? parseInt(tgtAKey[1]) : sn; // 未設定なら対面番号
  const isTarget = !!tgtAKey;
  const W = isTarget ? envCfg.W_target : rangeToW(student.range);

  const tgtDDef = adv[tgtANum]?.def || '';
  const atkScore = tgtDDef ? (DMG[student.atk]?.[tgtDDef] ?? 1.0) : 1.0;

  // --- defScore: このAを攻撃対象とするDの攻撃属性（逆引き）---
  const attackerDNum = findAttackerD(rule, sn);
  const effectiveDNum = attackerDNum ?? sn; // 未設定なら対面番号
  const attackerDAtk = adv[effectiveDNum]?.atk || '';
  const defRaw   = attackerDAtk ? (DMG[attackerDAtk]?.[student.def] ?? 1.0) : 1.0;
  const defScore = 1 / defRaw;

  const mainScore = Math.pow(atkScore, W) * Math.pow(defScore, 1 - W);

  // --- タイブレーク: 対面D（同番号）の攻撃/防御属性でスコア差を微小加算 ---
  const faceDAtk = adv[sn]?.atk || '';
  const faceDDef = adv[sn]?.def || '';
  const tbAtk = faceDDef ? (DMG[student.atk]?.[faceDDef] ?? 1.0) : 1.0;
  const tbDefRaw = faceDAtk ? (DMG[faceDAtk]?.[student.def] ?? 1.0) : 1.0;
  const tbDef = 1 / tbDefRaw;
  // タイブレークは主スコアの1%以内に収めて順位を微調整
  const tbScore = (Math.pow(tbAtk, W) * Math.pow(tbDef, 1 - W) - 1.0) * 0.005;

  return mainScore + tbScore;
}

// unowned: Set of student names that are greyed out (not raised)
let unownedSet = new Set();
try {
  const saved = JSON.parse(localStorage.getItem('pvp_unowned') || '[]');
  unownedSet = new Set(saved);
} catch(e) {}

function saveUnowned() {
  try { localStorage.setItem('pvp_unowned', JSON.stringify([...unownedSet])); } catch(e) {}
}

function isOwned(name) { return !unownedSet.has(name); }

function toggleOwned(name) {
  if (unownedSet.has(name)) unownedSet.delete(name);
  else unownedSet.add(name);
  saveUnowned();

  // ロスターアイコンを即時更新
  const el = document.getElementById('ri-' + name);
  if (el) el.classList.toggle('unowned', unownedSet.has(name));

  // 開いているポップアップの id を保持してから再描画
  const openIds = [...document.querySelectorAll('.student-popup.open')].map(p => p.id);

  // renderResults でポップアップのHTMLを再生成（getRecommendedStudents を再計算）
  renderResults();

  // 再描画後に同じポップアップを開き直す
  openIds.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.add('open');
  });
}

function renderRoster() {
  const el = document.getElementById('roster-grid');

  const sorted = [...STUDENTS].sort(kanaSort);

// 生徒名→データのマップ
var STUDENT_MAP = {};
var STUDENT_NAMES = [];

function filterStudents(query) {
  if(!query) return [];
  const q = query.toLowerCase();
  // 読み方前方一致（ひらがな検索）
  const yomiMatch = STUDENTS.filter(function(s){
    return s.yomi && s.yomi.startsWith(q);
  }).map(function(s){ return s.name; });
  // 名前の部分一致（漢字・カタカナ検索）
  const nameMatch = STUDENTS.filter(function(s){
    return s.name.toLowerCase().includes(q) && yomiMatch.indexOf(s.name) === -1;
  }).map(function(s){ return s.name; });
  // 読み方前方一致を上位に、名前部分一致を後ろに結合して返す
  return yomiMatch.concat(nameMatch).slice(0, 10);
}

function onStudentInput(n, val) {
  const listEl = document.getElementById(`sl-${n}`);
  const matches = filterStudents(val);
  if(matches.length && val) {
    listEl.innerHTML = matches.map(name=>`
      <div class="student-suggest-item" onmousedown="selectStudent(${n},'${name.replace(/'/g,"\'")}')">
        <img src="students/${name}.png" onerror="this.src='data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAIB'" alt="">
        ${name}

    listEl.classList.add('open');
  } else {
    listEl.classList.remove('open');
  }
}

/* ===== カスタムスライダードラッグ（相対移動方式） ===== */
(function(){
  // dragging: { key, wrap, startX, startVal }
  let dragging = null;

  function setSliderVal(key, val) {
    val = Math.max(0, Math.min(1, val));
    val = Math.round(val * 100) / 100;
    const pct = (val * 100).toFixed(1) + '%';
    const thumb = document.getElementById('st-' + key);
    const fill  = document.getElementById('sf-' + key);
    if (thumb) thumb.style.left = pct;
    if (fill)  fill.style.width = pct;
    onEnvSlider(key, val);
  }

  function clientX(e) {
    return e.touches ? e.touches[0].clientX : e.clientX;
  }

  // トラック部分（つまみ以外）をクリックした場合はその位置に即ジャンプ
  // つまみをドラッグした場合は相対移動
  document.addEventListener('pointerdown', function(e) {
    const thumb = e.target.closest('.env-slider-thumb');
    const track = e.target.closest('.env-slider-track');
    const wrap  = e.target.closest('.env-slider-wrap');
    if (!wrap) return;
    const key = wrap.dataset.key;
    if (!key) return;

    const rect = wrap.getBoundingClientRect();

    if (thumb) {
      // つまみを掴んだ: 現在値を起点に相対移動
      const curVal = envCfg[key] ?? 0.5;
      dragging = { key, wrap, startX: clientX(e), startVal: curVal, wrapW: rect.width };
      thumb.classList.add('dragging');
      thumb.setPointerCapture(e.pointerId);
    } else {
      // トラッククリック: その位置に即移動
      const pct = Math.max(0, Math.min(1, (clientX(e) - rect.left) / rect.width));
      setSliderVal(key, pct);
      // そのままドラッグ継続できるよう dragging をセット
      dragging = { key, wrap, startX: clientX(e), startVal: pct, wrapW: rect.width };
    }
    e.preventDefault();
  }, { passive: false });

  document.addEventListener('pointermove', function(e) {
    if (!dragging) return;
    const dx   = clientX(e) - dragging.startX;
    const dval = dx / dragging.wrapW;
    setSliderVal(dragging.key, dragging.startVal + dval);
    e.preventDefault();
  }, { passive: false });

  document.addEventListener('pointerup', function(e) {
    if (!dragging) return;
    const thumb = document.getElementById('st-' + dragging.key);
    if (thumb) thumb.classList.remove('dragging');
    dragging = null;
  });

  document.addEventListener('pointercancel', function() {
    if (dragging) {
      const thumb = document.getElementById('st-' + dragging.key);
      if (thumb) thumb.classList.remove('dragging');
    }
    dragging = null;
  });
})();

function togglePopup(id, e){
  e.stopPropagation();
  const el = document.getElementById(id);
  const wasOpen = el.classList.contains('open');
  document.querySelectorAll('.student-popup.open').forEach(p => {
    p.classList.remove('open');
    p.style.left = '';
    p.style.top  = '';
  });
  if (!wasOpen) {
    const btn = e.currentTarget;
    const rect = btn.getBoundingClientRect();
    const popupW = 340;
    const margin = 6;
    // 左右はみ出しチェック
    let left = rect.left;
    if (left + popupW > window.innerWidth - margin) {
      left = window.innerWidth - popupW - margin;
    }
    if (left < margin) left = margin;
    // 下にはみ出す場合は上に出す
    const estH = 300;
    let top = rect.bottom + margin;
    if (top + estH > window.innerHeight - margin) {
      top = rect.top - estH - margin;
      if (top < margin) top = margin;
    }
    el.style.left = left + 'px';
    el.style.top  = top  + 'px';
    el.classList.add('open');
  }
}

/* ===== Googleスプレッドシート読み込み ===== */
const VALID_RANGES_SET = new Set([
  '350','350\u{1F6E1}\u{FE0F}'.normalize(),'350\uD83D\uDEE1\uFE0F',
  '350🛡','450','450🛡','550','550🛡',
  '650','650🛡','750','750🛡','850','850🛡',
  '\u30C4\u30EB\u30AE','\u30A2\u30AB\u30CD',
  '\u30B7\u30E5\u30F3\u5C5E','\u30C9\u30D2\u30CA\u5C5E'
]);

function cleanCell(v) {
  if (!v) return '';
  return v.replace(/[\u200b\u00a0]/g,'').trim();
}

function parseRangesFromCell(raw) {
  if (!raw) return [];
  return raw.split(',').map(function(s){ return s.trim(); })
    .filter(function(s){ return VALID_RANGES_SET.has(s); });
}

function parseTargetCell(raw) {
  if (!raw) return '';
  var v = raw.trim().toLowerCase();
  return ['a1','a2','a3','a4','d1','d2','d3','d4'].indexOf(v) >= 0 ? v : '';
}

function loadFromSheet() {
  var statusEl = document.getElementById('sheet-status');
  var btn      = document.getElementById('sheet-load-btn');
  var listEl   = document.getElementById('sheet-imported-list');

  if (statusEl) {
    statusEl.className = 'sheet-status loading';
    statusEl.textContent = '読み込み中…';
  }
  if (btn) btn.disabled = true;
  if (listEl) listEl.innerHTML = '';

  // みん辞書 GAS WebApp URL（固定）
  var gasUrl = 'https://script.google.com/macros/s/AKfycbzdCiRqUkRIFZIknfvmtOEqNAtjbhSXZnkUqsBnKKLALZEA8ZpOYwbHw3oSDrHQdumSVQ/exec';

  fetch(gasUrl)
    .then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function(data) {
      if (!data || data.success !== true || !Array.isArray(data.rules)) {
        throw new Error('GASから正常なルールデータを取得できませんでした');
      }

      var sheetRules = data.rules;

      console.log('GAS取得件数:', data.count);
      console.log('GASスキップ件数:', data.skipped);
      console.log('実際のルール配列:', sheetRules);

      var newRules = sheetRules.map(function(rule) {
        return {
          id: Date.now() + Math.random(),
          name: rule.name,
          a: rule.a,
          d: rule.d,
          targetA: rule.targetA || {},
          targetD: rule.targetD || {},
          fromSheet: true
        };
      });

      if (newRules.length === 0) {
        if (statusEl) {
          statusEl.className = 'sheet-status err';
          statusEl.textContent =
            '有効なルールが見つかりませんでした。' +
            (data.skipped ? '（' + data.skipped + ' 件は条件不備のため除外）' : '');
        }
        return;
      }

      // 以前に読み込んだスプレッドシート由来のルールだけを入れ替える。
      // 手動登録したローカルルールは残す。
      rules = rules
        .filter(function(r) { return !r.fromSheet; })
        .concat(newRules);

      try {
        localStorage.setItem('pvp_rules', JSON.stringify(rules));
      } catch (e) {
        console.warn('localStorage保存エラー:', e);
      }

      renderSavedRules();
      renderResults();

      if (statusEl) {
        statusEl.className = 'sheet-status ok';
        statusEl.textContent =
          '✓ ' + newRules.length + ' 件のルールを読み込みました。' +
          (data.skipped ? '（' + data.skipped + ' 件は除外）' : '');
      }

      if (listEl) {
        listEl.innerHTML = newRules.map(function(r) {
          return '<span class="sheet-chip">' + escHtml(r.name) + '</span>';
        }).join('');
      }
    })
    .catch(function(e) {
      console.error('Googleスプレッドシート読み込みエラー:', e);
      if (statusEl) {
        statusEl.className = 'sheet-status err';
        statusEl.textContent =
          '読み込みエラー: ' + e.message +
          '。GAS WebアプリのURLとアクセス権（全員）を確認してください。';
      }
    })
    .finally(function() {
      if (btn) btn.disabled = false;
    });
}

/* ===== お知らせ ===== */
function loadNews() {
  var el = document.getElementById('news-content');
  if (!el) return;
  fetch('news.txt')
    .then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    })
    .then(function(text) {
      el.textContent = text;
    })
    .catch(function() {
      el.textContent = '（お知らせファイルが見つかりません）';
    });
}

function switchTab(tab){
  document.querySelectorAll('.tab-pane').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(e=>e.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  document.querySelectorAll('.tab-btn')[{advisor:0,rules:1,matrix:2,season:3,appsettings:4}[tab]].classList.add('active');
  if(tab==='season') renderSeasonTab();
  if(tab==='appsettings'){ renderAppSettings(); loadNews(); }
}
