<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>A.R.E.S</title>
<style>
body {
  font-family: sans-serif;
  display: flex;
}
#left {
  width: 70%;
}
#right {
  width: 30%;
}
canvas {
  border: 1px solid black;
}
button {
  margin: 5px;
}
#winner {
  font-size: 20px;
  color: red;
}
</style>
</head>
<body>

<div id="left">
  <h2>A.R.E.S</h2>
  <button onclick="start()">スタート</button>
  <button onclick="pause()">一時停止/解除</button>
  <button onclick="skip()">スキップ</button>
  <div id="winner"></div>
  <canvas id="canvas" width="700" height="400"></canvas>
</div>

<div id="right"></div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let running = false;
let paused = false;
let fast = false;

let popups = [];

const damageTable = {
 "ドカン": {"かるーい":2,"おもーい":1,"まぜまぜ":1,"ふしぎー":0.5,"もちもち":0.5},
 "ズバッ": {"かるーい":0.5,"おもーい":2,"まぜまぜ":1,"ふしぎー":1,"もちもち":1},
 "バラバラ": {"かるーい":0.5,"おもーい":1.5,"まぜまぜ":2,"ふしぎー":1,"もちもち":1},
 "グルル": {"かるーい":1,"おもーい":0.5,"まぜまぜ":0.5,"ふしぎー":2,"もちもち":1},
 "ブルブル": {"かるーい":1,"おもーい":0.5,"まぜまぜ":0.5,"ふしぎー":1.5,"もちもち":2}
};

class Unit {
  constructor(team,x,y){
    this.team = team;
    this.x = x;
    this.y = y;
    this.maxHp = 30;
    this.hp = 30;
    this.range = 400;
    this.attack = "ドカン";
    this.defense = "かるーい";
    this.lastAttack = 0;
    this.dead = false;
  }
}

let units = [];

function init(){
  units = [];
  for(let i=0;i<4;i++){
    units.push(new Unit("red",50,80*i+50));
    units.push(new Unit("blue",650,80*i+50));
  }
  document.getElementById("winner").innerText = "";
}

function distance(a,b){
  return Math.hypot(a.x-b.x,a.y-b.y);
}

function update(){

  for(let u of units){
    if(u.dead) continue;

    let enemies = units.filter(e=>e.team!==u.team && !e.dead);

    if(enemies.length===0){
      declareWinner(u.team);
      return;
    }

    let inRange = enemies.filter(e=>distance(u,e)<=u.range);

    if(inRange.length>0){
      let target = inRange.sort((a,b)=>distance(u,a)-distance(u,b))[0];

      if(performance.now()-u.lastAttack>600){
        u.lastAttack = performance.now();

        if(Math.random()>0.1){
          let mult = damageTable[u.attack][target.defense];
          let dmg = 2 * mult;

          target.hp -= dmg;

          popups.push({
            x: target.x,
            y: target.y,
            text: "-" + dmg,
            life: 50
          });

          if(target.hp<=0){
            target.dead = true;
          }
        }
      }

    }else{
      let nearest = enemies.sort((a,b)=>distance(u,a)-distance(u,b))[0];
      let dx = nearest.x - u.x;
      let dy = nearest.y - u.y;
      let len = Math.hypot(dx,dy);
      u.x += dx/len*2;
      u.y += dy/len*2;
    }
  }
}

function declareWinner(team){
  running = false;
  document.getElementById("winner").innerText = team + " 勝利";
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  for(let u of units){
    if(u.dead) continue;

    // 本体
    ctx.beginPath();
    ctx.fillStyle = u.team==="red"?"red":"blue";
    ctx.arc(u.x,u.y,8,0,Math.PI*2);
    ctx.fill();

    // HPバー
    let ratio = u.hp / u.maxHp;
    let color = "green";
    if(ratio < 0.5) color = "orange";
    if(ratio < 0.2) color = "red";

    ctx.fillStyle = "#ccc";
    ctx.fillRect(u.x-15,u.y-18,30,4);

    ctx.fillStyle = color;
    ctx.fillRect(u.x-15,u.y-18,30*ratio,4);

    // HP数値
    ctx.fillStyle = "black";
    ctx.font = "10px sans-serif";
    ctx.fillText(Math.ceil(u.hp), u.x-6, u.y-22);
  }

  // ポップアップ
  for(let p of popups){
    ctx.globalAlpha = p.life/50;
    ctx.fillStyle = "black";
    ctx.font = "12px sans-serif";
    ctx.fillText(p.text,p.x,p.y);

    p.y -= 0.5;
    p.life--;
  }
  ctx.globalAlpha = 1;

  popups = popups.filter(p=>p.life>0);
}

function loop(){
  if(!running) return;

  if(!paused){
    let step = fast?20:1;
    for(let i=0;i<step;i++) update();
  }

  draw();
  requestAnimationFrame(loop);
}

function start(){
  running = true;
  paused = false;
  fast = false;
  init();
  loop();
}

function pause(){
  paused = !paused;
}

function skip(){
  fast = true;
}

</script>
</body>
</html>
