<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>A.R.E.S</title>
<style>
body { display:flex; font-family:sans-serif; }
#left { width:70%; }
#right { width:30%; height:95vh; overflow:auto; }
canvas { border:1px solid black; }
.box { border:1px solid #aaa; margin:5px; padding:5px; }
</style>
</head>
<body>

<div id="left">
<h2>A.R.E.S</h2>
<button onclick="start()">スタート</button>
<button onclick="pause()">一時停止</button>
<button onclick="skip()">スキップ</button>
<div id="winner"></div>
<canvas id="canvas" width="700" height="400"></canvas>
</div>

<div id="right">
<button onclick="saveStatus()">ステータス保存</button>
<button onclick="resetStatus()">ステータスリセット</button>
<div id="panel"></div>
</div>

<script>
const ctx = canvas.getContext("2d");

let units=[], bullets=[], popups=[], obstacles=[];
let savedData=[], savedObs=[];

const HARDNESS_HP = {"柔らかい":2,"硬い":7,"とても硬い":13};
const RANGE_OPTIONS=[350,450,550,650,750,850];

class Obstacle{
 constructor(x,y,data){
  this.x=x; this.y=y;
  this.active=data.active;
  this.radius=data.radius;
  this.hp=HARDNESS_HP[data.hardness];
  this.hardness=data.hardness;
 }
}

class Unit{
 constructor(team,x,y,id,data){
  this.team=team; this.id=id;
  this.x=x; this.y=y;
  this.range=data.range*0.75;
  this.hp=data.hp; this.maxHp=data.hp;
  this.attack=data.attack;
  this.defense=data.defense;
  this.lastAttack=0;
  this.dead=false;
 }
}

function createObstacles(){
 obstacles=[];
 for(let i=0;i<5;i++){
  let d=savedObs[i]||{active:false,radius:20,hardness:"硬い"};
  obstacles.push(new Obstacle(350,80*i+50,d));
 }
}

function createUnits(){
 units=[];
 for(let i=0;i<4;i++){
  let d=savedData[i]||{range:400,hp:30,attack:"ドカン",defense:"かるーい"};
  units.push(new Unit("red",50,80*i+50,i+1,d));
 }
 for(let i=0;i<4;i++){
  let d=savedData[i+4]||{range:400,hp:30,attack:"ドカン",defense:"かるーい"};
  units.push(new Unit("blue",650,80*i+50,i+1,d));
 }
}

function start(){
 bullets=[]; popups=[];
 createUnits();
 createObstacles();
 loop();
}

function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

function update(){

 for(let u of units){
  if(u.dead) continue;

  let enemies=units.filter(e=>e.team!==u.team && !e.dead);
  if(enemies.length===0){return;}

  let target=enemies.sort((a,b)=>distance(u,a)-distance(u,b))[0];

  let d=distance(u,target);

  if(d<=u.range){
    if(performance.now()-u.lastAttack>600){
      u.lastAttack=performance.now();

      let dx=(target.x-u.x)/d;
      let dy=(target.y-u.y)/d;

      bullets.push({x:u.x,y:u.y,dx,dy,owner:u,startX:u.x,startY:u.y});
    }
  }else{

    let dx=target.x-u.x;
    let dy=target.y-u.y;
    let len=Math.hypot(dx,dy);

    // 遮蔽物回避
    for(let o of obstacles){
      if(!o.active) continue;
      if(distance(u,o) < o.radius+5){
        dx += (u.y-o.y);
        dy -= (u.x-o.x);
      }
    }

    u.x+=dx/len*2;
    u.y+=dy/len*2;
  }

  // 吸引
  for(let o of obstacles){
    if(!o.active) continue;
    if(distance(u,o) < o.radius+10){
      let dx=target.x-o.x;
      let dy=target.y-o.y;
      let len=Math.hypot(dx,dy);
      u.x=o.x - dx/len*(o.radius+5);
      u.y=o.y - dy/len*(o.radius+5);
    }
  }
 }

 // 弾
 for(let b of bullets){

  b.x+=b.dx*5;
  b.y+=b.dy*5;

  // 遮蔽物衝突
  for(let o of obstacles){
    if(!o.active) continue;
    if(distance(b,o)<o.radius){
      o.hp--;
      if(o.hp<=0) o.active=false;
      b.hit=true;
    }
  }

  for(let t of units){
    if(t.dead || t.team===b.owner.team) continue;
    if(distance(b,t)<8){
      t.hp-=2;
      if(t.hp<=0) t.dead=true;
      b.hit=true;
    }
  }
 }

 bullets=bullets.filter(b=>!b.hit);
}

function draw(){

 ctx.clearRect(0,0,canvas.width,canvas.height);

 // 遮蔽物
 for(let o of obstacles){
  if(!o.active) continue;

  ctx.beginPath();
  ctx.strokeStyle="black";
  ctx.arc(o.x,o.y,o.radius,0,Math.PI*2);
  ctx.stroke();

  ctx.beginPath();
  ctx.strokeStyle="gray";
  ctx.arc(o.x,o.y,o.radius+5,0,Math.PI*2);
  ctx.stroke();

  ctx.beginPath();
  ctx.strokeStyle="lightgray";
  ctx.arc(o.x,o.y,o.radius+10,0,Math.PI*2);
  ctx.stroke();
 }

 // ユニット
 for(let u of units){
  if(u.dead) continue;
  ctx.beginPath();
  ctx.fillStyle=u.team==="red"?"red":"blue";
  ctx.arc(u.x,u.y,10,0,Math.PI*2);
  ctx.fill();
 }

 // 弾
 for(let b of bullets){
  ctx.beginPath();
  ctx.arc(b.x,b.y,3,0,Math.PI*2);
  ctx.fill();
 }
}

function loop(){
 update();
 draw();
 requestAnimationFrame(loop);
}

buildUI();

function buildUI(){
 let panel=document.getElementById("panel");
 panel.innerHTML="";

 // 遮蔽物UI
 for(let i=0;i<5;i++){
  panel.innerHTML+=`
  <div class="box">
  <b>遮蔽物${i+1}</b><br>
  ON:<input type="checkbox" id="oa${i}"><br>
  半径:<input type="range" min="5" max="30" id="or${i}"><br>
  硬さ:
  <select id="oh${i}">
    <option>柔らかい</option>
    <option selected>硬い</option>
    <option>とても硬い</option>
  </select>
  </div>`;
 }
}
</script>
</body>
</html>
